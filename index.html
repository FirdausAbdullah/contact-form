<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main_div">
    <div class="div_image">
      <img src="./assets/landscape_city.jpg" alt="Main image">
    </div>
    <div class="form_div">
      <div class="right_one">
        <h2>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Culpa accusantium odio 
          dolorem quaerat aspernatur aliquid fuga atque reprehenderit velit magni?</h2>
        <h3>Lorem ipsum dolor sit amet.</h3>
      </div>
      <div class="right_form_two">
        
        <form action="/my-handling-form-page" method="post">
          <div class="div_section">
          <section class="form_left">
            <ul>
            <li>
              <label for="first_name">FIRST NAME:</label>
              <input type="text" id="first_name" name="user_first_name" />
            </li>
            <li>
              <label for="mail">EMAIL:</label>
              <input type="email" id="mail" name="user_email" />
            </li>
            <li>
              <label for="pwd">PASSWORD:</label>
              <input type="password" id="pwd" name="pwd"></input>
            </li>
            </ul>
          </section>

          <section class="form_right">
            <ul>
            <li>
              <label for="last_name">LAST NAME:</label>
              <input type="text" id="last_name" name="user_last_name" />
            </li>
            <li>
              <label for="phone">PHONE NUMBER:</label>
              <input type="tel" id="phone" name="user_phone" />
            </li>
            <li>
              <label for="pwd">CONFIRM PASSWORD:</label>
              <input type="password" id="pwd" name="pwd"></input>
            </li>
            </ul>
          </section>
          </div>
          <section class="form_submit">
            <p class="button">
              <button type="submit">Send your message</button>
            </p>
          </section>
        </form>
      
      </div>
    </div>
  </div>

</body>
</html>
